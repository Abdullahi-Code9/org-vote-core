[patch.crates-io]
ed25519-dalek = { git = "https://github.com/dalek-cryptography/curve25519-dalek", tag = "ed25519-2.1.0" }

[package]
name = "org-vote"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=22.0.1"
# Pin below 2.2 / 3.x so Cargo does not pull rand 0.9 CryptoRng (breaks soroban-env-host).
ed25519-dalek = "=2.1.1"

[dev-dependencies]
soroban-sdk = { version = "22.0.1", features = ["testutils"] }
ed25519-dalek = "=2.1.0"

[profile.release]
opt-level = "z"
overflow-checks = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
